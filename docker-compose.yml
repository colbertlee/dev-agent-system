version: "3.8"

services:
  dev-agent-system:
    build: .
    image: dev-agent-system:latest
    container_name: dev-agent-system
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - WORKSPACE_DIR=/app/workspace
      - MEMORY_DIR=/app/memory_store
    volumes:
      - ./workspace:/app/workspace
      - ./memory_store:/app/memory_store
      - ./backups:/app/backups
      - ./chroma_data:/app/chroma_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
